<!-- Botão de abertura flutuante no mobile -->
@if (showMobileToggle) {
  <button
    type="button"
    class="sidebar-mobile-toggle"
    [class.is-hidden]="isMobileOpen"
    (click)="toggleMobile()"
    aria-label="Abrir menu de navegação"
    title="Abrir menu"
  >
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
}

<!-- Backdrop para fechar no clique fora (mobile) -->
<div
  class="sidebar-backdrop"
  [class.active]="isMobileOpen"
  (click)="closeMobile()"
  aria-hidden="true"
></div>

<!-- Barra Lateral Principal -->
<aside
  class="sidebar"
  [class.collapsed]="isCollapsed"
  [class.mobile-open]="isMobileOpen"
  role="navigation"
  aria-label="Menu lateral"
>
  <!-- Cabeçalho com Logo e Botões de Controle -->
  <div class="sidebar-header">
    <div class="logo-container" [title]="isCollapsed ? 'Pequi Shorter' : ''">
      <img
        [src]="logoSrc"
        alt="Logo Pequi Shorter"
        class="sidebar-logo"
      />
      <div class="brand-text">
        <span class="brand-name">Pequi Shorter</span>
        <span class="brand-tag">Encurtador</span>
      </div>
    </div>

    <!-- Botão de fechar (exibido apenas no mobile) -->
    <button
      type="button"
      class="sidebar-btn-close"
      (click)="closeMobile()"
      aria-label="Fechar menu"
      title="Fechar menu"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Botão de recolher/expandir (desktop) -->
    <button
      type="button"
      class="sidebar-btn-collapse"
      (click)="toggleCollapse()"
      [attr.aria-expanded]="!isCollapsed"
      [title]="isCollapsed ? 'Expandir menu' : 'Recolher menu'"
      aria-label="Alternar recolhimento do menu"
    >
      <svg
        class="collapse-icon"
        [class.rotated]="isCollapsed"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Navegação -->
  <div class="sidebar-body">
    <span class="section-label">Navegação</span>

    <ul class="nav-list">
      @for (item of navItems; track item.id) {
        <li class="nav-item">
          <button
            type="button"
            class="nav-link-btn"
            [class.active]="activeItemId === item.id"
            [attr.data-tooltip]="item.label"
            (click)="selectItem(item)"
          >
            <!-- Indicador ativo -->
            <span class="active-indicator"></span>

            <!-- Ícone -->
            <span class="nav-icon">
              @switch (item.icon) {
                @case ('home') {
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                  </svg>
                }
                @case ('link') {
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                  </svg>
                }
                @case ('list') {
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                  </svg>
                }
                @case ('chart') {
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                  </svg>
                }
                @case ('settings') {
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                  </svg>
                }
              }
            </span>

            <!-- Título do item -->
            <span class="nav-label">{{ item.label }}</span>

            <!-- Badge opcional -->
            @if (item.badge) {
              <span class="nav-badge" [class.badge-warning]="item.badgeType === 'warning'">
                {{ item.badge }}
              </span>
            }
          </button>
        </li>
      }
    </ul>
  </div>

  <!-- Rodapé com Usuário e Logout -->
  <div class="sidebar-footer">
    <div class="user-card" [title]="isCollapsed ? (userName + ' (' + userRole + ')') : ''">
      <div class="user-avatar">
        @if (userAvatarUrl) {
          <img [src]="userAvatarUrl" [alt]="userName" class="avatar-img" />
        } @else {
          <span class="avatar-initials">{{ userInitials }}</span>
        }
      </div>

      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>

      <button
        type="button"
        class="btn-logout"
        (click)="onLogout()"
        aria-label="Encerrar sessão"
        [title]="'Sair'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</aside>
